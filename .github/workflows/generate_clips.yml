name: Generate Shorts & Clips

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: 'YouTube / Video URL or Direct Media Link'
        required: true
        default: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
      content_category:
        description: 'Content Archetype'
        required: true
        type: choice
        default: 'general'
        options:
          - 'general'
          - 'gaming'
          - 'podcast'
          - 'education'
          - 'vlog'
      layout_mode:
        description: 'Video Layout Mode'
        required: true
        type: choice
        default: 'facetrack'
        options:
          - 'facetrack'
          - 'stacked'
          - 'blur_padding'
      num_clips:
        description: 'Number of clips to generate'
        required: true
        default: '2'
      captions_style:
        description: 'Caption preset'
        required: true
        type: choice
        default: 'bold_yellow'
        options:
          - 'bold_yellow'
          - 'cyber_green'
          - 'clean_minimal'

jobs:
  clip:
    name: Process & Render Clips
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-glx libglib2.0-0

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: 'release'
          github-token: ${{ github.token }}

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ClipCraft Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python main.py clip "${{ github.event.inputs.source_url }}" \
            -c "${{ github.event.inputs.content_category }}" \
            -l "${{ github.event.inputs.layout_mode }}" \
            -n ${{ github.event.inputs.num_clips }} \
            -s "${{ github.event.inputs.captions_style }}"

      - name: Upload Generated Clips & Manifest
        uses: actions/upload-artifact@v4
        with:
          name: clipcraft-deliverables
          path: output/shorts/
          if-no-files-found: ignore
